<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Student Quiz Portal</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link rel="stylesheet" href="quiz.css">
</head>
<body>
  <!-- this is  Login/Signup page  -->
  <div class="container" id="container">
    <div class="form-container sign-up">
      <form id="signup-form">
        <h1>Create Account</h1>
        <div class="social-icons">
          <a href="#" class="icon" ><i class="fa-brands fa-google-plus-g"></i></a>
          <a href="#" class="icon"><i class="fa-brands fa-facebook-f"></i></a>
          <a href="#" class="icon"><i class="fa-brands fa-github"></i></a>
          <a href="#" class="icon"><i class="fa-brands fa-linkedin-in"></i></a>
        </div>
        <span>or register with your email</span>
        <input type="text" id="signup-name" placeholder="Full Name" />
        <div class="error" id="err-signup-name"></div>
        <input type="email" id="signup-email" placeholder="Email Address" />
        <div class="error" id="err-signup-email"></div>
        <input type="password" id="signup-password" placeholder="Create Password" />
        <div class="error" id="err-signup-password"></div>
        <button type="submit">Create Account</button>
      </form>
    </div>

    <div class="form-container sign-in">
      <form id="signin-form">
        <h1>Log In</h1>
        <div class="social-icons">
          <a href="#" class="icon"><i class="fa-brands fa-google-plus-g"></i></a>
          <a href="#" class="icon"><i class="fa-brands fa-facebook-f"></i></a>
          <a href="#" class="icon"><i class="fa-brands fa-github"></i></a>
          <a href="#" class="icon"><i class="fa-brands fa-linkedin-in"></i></a>
        </div>
        <span>or log in with your email</span>
        <input type="email" id="signin-email" placeholder="Email Address" />
        <div class="error" id="err-signin-email"></div>
        <input type="password" id="signin-password" placeholder="Password" />
        <div class="error" id="err-signin-password"></div>
        <a href="#">Forgot Password?</a>
        <button type="submit">Log In</button>
      </form>
    </div>

    <div class="toggle-container">
      <div class="toggle">
        <div class="toggle-panel toggle-left login-card">
          <h1>Your Quiz journey continues here 🚀</h1>
          <p>Log in to access the quiz and track your progress</p>
          <button class="hidden" id="login">Log In</button>
        </div>
        <div class="toggle-panel toggle-right glass-box">
          <h1>Join the Quizverse🚀</h1>
          <p>Create your free account to begin your quiz journey</p>
          <button class="hidden" id="register">Create Account</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Quiz part -->
  <div id="quiz-zone">
    <div class="top">
      <h2 id="quiz-welcome">Welcome</h2>
      <div id="quiz-timer">Time Left: <span id="quiz-time">10</span>s</div>
    </div>

    <div id="quiz-area"></div>

    <div class="controls">
      <button id="btn-prev" class="btn-quiz" disabled>Previous</button>
      <button id="btn-next" class="btn-quiz">Next</button>
    </div>

    <div id="quiz-result">
      <h3 id="result-title"></h3>
      <div id="result-summary"></div>
      <div id="result-table-wrap"></div>
      <button id="btn-restart" class="btn-quiz">Restart Quiz</button>
    </div>
  </div>

  <script src="quiz.js"></script>
</body>
</html>
